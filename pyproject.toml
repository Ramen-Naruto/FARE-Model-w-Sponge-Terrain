[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fare-model"
version = "0.1.0"
description = "A Fast Autoconversion Rain Evaporation model for moist precipitating convection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
]

[project.scripts]
fare-model = "fare_model.__main__:main"

[tool.setuptools]
packages = ["fare_model"]
